<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Professioneller Rechnungs-Generator - Rechnify">
  <title>Geheime Seite – Professioneller Rechnungs-Generator</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/invoice.css">
  <script src="js/auth.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-btn">Startseite</a>
    <a href="kontakt.html" class="nav-btn">Kontakt</a>
    <a href="geheim.html" class="nav-btn active">Geheime Seite</a>
  </nav>
  <div id="invoice-app">
    <h1>Professioneller Rechnungs-Generator</h1>
    <div class="button-group">
      <div id="googleSignInBtn"></div>
      <button id="signout-button" class="btn-delete" style="display:none;">🚪 Abmelden</button>
      <span id="signin-text" style="align-self:center;">🔓 Nicht angemeldet</span>
    </div>
    <div class="input-group">
      <div>
        <label>Logo (optional):
          <input type="file" id="logoUpload" accept="image/*" />
          <img id="logoPreview" class="logo-preview" alt="Logo Vorschau">
        </label>
      </div>
      <div>
        <label class="required-field">Rechnungsdatum:
          <input type="date" id="date" required />
        </label>
      </div>
    </div>
    <label class="required-field">Dein Name / Firma:
      <input type="text" id="company" placeholder="Max Mustermann GmbH" required />
    </label>
    <label class="required-field">Kunde auswählen:
      <select id="clientSelect" onchange="fillClientFromSelect()" disabled>
        <option value="">Neuen Kunden anlegen</option>
      </select>
    </label>
    <input type="text" id="client" placeholder="Kundenname eingeben" required />

    <div class="button-group">
      <button class="btn-save" onclick="saveClient()" disabled>💾 Daten speichern</button>
      <button class="btn-delete" onclick="deleteClient()" disabled>🗑️ Kunde löschen</button>
    </div>

    <label>Rechnungsnummer (optional):
      <input type="text" id="invoiceNumber" placeholder="Wird automatisch generiert" />
    </label>
    <label>Mehrwertsteuer (%):
      <input type="number" id="vatRate" value="20" step="0.1" />
    </label>
    <h3>Positionen</h3>
    <table id="items">
      <thead>
        <tr>
          <th class="required-field">Beschreibung</th>
          <th>Menge</th>
          <th class="required-field">Preis (€)</th>
          <th>Gesamt</th>
          <th>Aktion</th>
        </tr>
      </thead>
      <tbody id="item-rows">
        <tr>
          <td><input type="text" class="item-desc" required /></td>
          <td><input type="number" class="item-qty" value="1" min="1" /></td>
          <td><input type="number" class="item-price" value="0.00" step="0.01" required /></td>
          <td class="item-total">0.00 €</td>
          <td><button onclick="removeRow(this)" class="remove-btn">×</button></td>
        </tr>
      </tbody>
    </table>
    <button class="btn-add" onclick="addRow()">+ Position hinzufügen</button>
    <div class="summary-card">
      <h3>Zusammenfassung</h3>
      <div class="summary-item"><span>Zwischensumme:</span><span id="subtotal">0.00 €</span></div>
      <div class="summary-item"><span>MwSt. (<span id="vatRateLabel">20</span>%):</span><span id="vatAmount">0.00 €</span></div>
      <div class="summary-item summary-total"><span>Gesamtsumme:</span><span id="totalAmount">0.00 €</span></div>
    </div>
    <label>Fußtext / Hinweise:
      <textarea id="footerNote" rows="3" placeholder="Bankverbindung, Zahlungsbedingungen..."></textarea>
    </label>
    <button class="btn-pdf" onclick="generatePDF()">📄 Professionelle PDF erstellen</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="js/invoice.js"></script>
</body>
</html>
