<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Willkommen bei Rechnify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255,255,255,0.98);
            border-radius: 18px;
            padding: 44px 32px 32px 32px;
            box-shadow: 0 8px 24px 0 rgba(0,0,0,0.10);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #3b82f6;
            margin-top: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        p {
            color: #374151;
            font-size: 1.1rem;
        }
        .button-group {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .button-link {
            display: inline-block;
            padding: 12px 0;
            text-decoration: none;
            background: linear-gradient(90deg, #3b82f6 0%, #6366f1 100%);
            color: #fff;
            border-radius: 8px;
            font-weight: 500;
            font-size: 1rem;
            box-shadow: 0 2px 8px 0 rgba(59,130,246,0.09);
            transition: background 0.2s, transform 0.2s;
        }
        .button-link:hover {
            background: linear-gradient(90deg, #2563eb 0%, #4f46e5 100%);
            transform: translateY(-2px) scale(1.03);
        }
        @media (max-width: 500px) {
            .container {
                padding: 28px 8px 20px 8px;
                max-width: 98vw;
            }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Willkommen bei Rechnify!</h1>
        <p>Dein smarter Einstieg in Verwaltung und Kalkulation.<br>
        Wähle eine Seite:</p>
        <div class="button-group">
            <a href="geheim.html" class="button-link">Geheime Seite</a>
            <a href="kontakt.html" class="button-link">Kontakt</a>
        </div>
    </div>
</body>
</html>
