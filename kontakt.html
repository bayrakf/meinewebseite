<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kontakt</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .navbar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }
    .nav-btn {
      padding: 12px 28px;
      border: none;
      border-radius: 6px;
      background: #3498db;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(52,152,219,0.10);
      text-decoration: none;
      display: inline-block;
    }
    .nav-btn:hover, .nav-btn.active {
      background: #2c3e50;
      color: #fff;
      box-shadow: 0 4px 20px rgba(44,62,80,0.10);
    }
    .kontakt-container {
      background: rgba(255,255,255,0.98);
      border-radius: 18px;
      padding: 44px 32px 32px 32px;
      box-shadow: 0 8px 24px 0 rgba(0,0,0,0.10);
      text-align: center;
      max-width: 400px;
      margin: auto;
    }
    h1 {
      color: #3b82f6;
      margin-top: 0;
      font-size: 2.2rem;
      letter-spacing: 1px;
    }
    p {
      color: #374151;
      font-size: 1.1rem;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 22px;
      background: linear-gradient(90deg, #3b82f6 0%, #6366f1 100%);
      color: #fff;
      border-radius: 8px;
      font-weight: 500;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 2px 8px 0 rgba(59,130,246,0.09);
      transition: background 0.2s, transform 0.2s;
    }
    .back-link:hover {
      background: linear-gradient(90deg, #2563eb 0%, #4f46e5 100%);
      transform: translateY(-2px) scale(1.03);
    }
  </style>
</head>
<body>
   <nav class="navbar">
    <a href="index.html" class="nav-btn">Startseite</a>
    <a href="geheim.html" class="nav-btn">Geheime Seite</a>
  </nav>
  <div class="kontakt-container">
    <h1>Kontakt</h1>
    <p>Hier kannst du deine Kontaktinformationen eintragen.</p>
    <a href="index.html" class="back-link">Zurück zur Startseite</a>
  </div>
</body>
</html>
